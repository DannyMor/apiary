# Copy to ~/.config/apiary/apiary.toml (or point APIARY_CONFIG at it).
# Every key is optional; these are the defaults.

[paths]
claude_dir  = "~/.claude/projects"          # where Claude Code writes transcripts
db          = "~/.local/share/apiary/apiary.db"  # Apiary's own index
archive_dir = "~/.local/share/apiary/archive"  # archived transcripts and summaries

[server]
host = "127.0.0.1"
port = 7431

[keeper]
# The command that writes honey: it gets the prompt as its last argument and the session
# extract on stdin. Add --model <id> if your claude default is unsuitable.
summarizer = "claude -p --no-session-persistence --output-format text"
summary_timeout_s = 240
summary_max_chars = 60000
